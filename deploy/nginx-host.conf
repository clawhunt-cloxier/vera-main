# Host nginx site for the test environment (/etc/nginx/sites-available/vera). TLS terminates here; the app listens on 127.0.0.1:8080.
server {
    listen 80;
    server_name vera.touziagent.com _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name vera.touziagent.com _;

    ssl_certificate     /etc/ssl/certs/vera.crt;
    ssl_certificate_key /etc/ssl/private/vera.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
