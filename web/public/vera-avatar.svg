<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 1254 1254" fill="none" role="img" aria-labelledby="vera-title vera-desc">
  <title id="vera-title">Vera · 投研助手</title>
  <desc id="vera-desc">深棕色长发、透明科技眼镜、两只黑色胶囊眼睛的极简 Q 版头像，深炭色方形背景。</desc>
