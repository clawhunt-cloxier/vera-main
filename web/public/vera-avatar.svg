      <stop offset="0" stop-color="#433438"/>
      <stop offset=".50" stop-color="#372a2d"/>
      <stop offset="1" stop-color="#2a2226"/>
    </linearGradient>
    <linearGradient id="hair-fringe" x1="120" y1="90" x2="694" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a383c"/>
      <stop offset=".55" stop-color="#3b2d31"/>
      <stop offset="1" stop-color="#34282d"/>
    </linearGradient>
    <linearGradient id="skin" x1="315" y1="488" x2="600" y2="1145" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe9df"/>
      <stop offset=".65" stop-color="#ffe4da"/>
      <stop offset="1" stop-color="#f8d8cd"/>
    </linearGradient>
    <linearGradient id="face-side" x1="690" y1="490" x2="835" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f9d9cc"/>
      <stop offset="1" stop-color="#ebc4b9"/>
    </linearGradient>
