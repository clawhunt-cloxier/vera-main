name: Deploy to Test Environment

on:
  push:
    branches: [dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      check_choice_quote:
        description: Check test-site Choice quote activation after deployment
        type: boolean
        default: false
      probe_choice_quote:
        description: Briefly stop the test site and query one real Choice snapshot for 600000.SH
        type: boolean
        default: false

concurrency:
  group: deploy-test
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: Build image and deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Resolve commit and image names
        id: vars
        env:
          RUN_SHA: ${{ github.sha }}
        run: |
          sha="${RUN_SHA:-$GITHUB_SHA}"
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Wait for Verify on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.vars.outputs.sha }}
        run: |
          for i in $(seq 1 60); do
            c=$(gh run list -R $GITHUB_REPOSITORY --workflow Verify --commit $SHA --json conclusion --jq .[0].conclusion || true)
            echo verify=$c
            case $c in success) exit 0;; failure|cancelled|timed_out) exit 1;; esac
            sleep 30
          done
          exit 1
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.vars.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:dev
            ${{ steps.vars.outputs.image }}:sha-${{ steps.vars.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi

      - name: Upload compose file
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          scp -i ~/.ssh/deploy_key -o BatchMode=yes deploy/compose.yml deploy/remote-deploy.sh "deploy@${DEPLOY_HOST}:/opt/vera/"

      - name: Deploy with health check and rollback
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.actor }}
          NEW_IMAGE: ${{ steps.vars.outputs.image }}:sha-${{ steps.vars.outputs.short }}
        run: |
          # stdin carries only the token; the script was uploaded in the previous step.
          echo "$GHCR_PAT" | ssh -i ~/.ssh/deploy_key -o BatchMode=yes "deploy@${DEPLOY_HOST}" "GHCR_USER='${GHCR_USER}' NEW_IMAGE='${NEW_IMAGE}' bash /opt/vera/remote-deploy.sh"

      - name: Read Choice quote activation status
        if: github.event_name == 'workflow_dispatch' && inputs.check_choice_quote
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "deploy@${DEPLOY_HOST}" 'docker exec vera /app/backend/vera emquant quote-status --demo-db'

      - name: Probe one Choice snapshot and restore the test site
        if: github.event_name == 'workflow_dispatch' && inputs.probe_choice_quote
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "deploy@${DEPLOY_HOST}" 'bash -se' <<'REMOTE'
          cd /opt/vera
          export VERA_IMAGE="$(docker inspect --format '{{.Config.Image}}' vera)"
          restore() {
            docker compose -f compose.yml start vera || return 1
            for i in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:8080/readyz >/dev/null 2>&1; then echo "test site ready"; return 0; fi
              sleep 3
            done
            return 1
          }
          trap 'restore || exit 1' EXIT
          docker compose -f compose.yml stop vera
          timeout --kill-after=30s 180s docker compose -f compose.yml run --rm --no-deps -T vera demo --probe-choice 600000.SH
          REMOTE

      - name: Cleanup SSH material
        if: always()
        run: rm -rf ~/.ssh/deploy_key
