name: Verify
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:realtime-ui
  native-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify native SDK build and release image
        run: |
          docker build --target native-check -t vera-native-check .
          docker build -t vera-release-check .
          docker run --rm --entrypoint /bin/sh vera-release-check -c 'test -r /usr/lib/x86_64-linux-gnu/libstdc++.so.6 && ldd /app/backend/vera && /app/backend/vera emquant help'
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # check-contract-compat diffs against the base revision
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache: false # No external Go modules yet.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tooling/requirements.txt
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make setup
      - name: Install filing text extractor for delivery tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils util-linux
      - name: Cache the pinned PostgreSQL binary for database tests
        run: bash scripts/cache-ci-postgres.sh "$RUNNER_TEMP/vera-test-pg"
      - run: make verify
        env:
          VERA_TEST_PG_DIR: ${{ runner.temp }}/vera-test-pg
          # Database-heavy packages each start PostgreSQL. Limit package-level
          # concurrency so deadline tests are not starved on small runners;
          # every test and the Go race detector still run.
          GOFLAGS: -p=1
          # PRs compare with the target base; pushes with the previous tip (empty on new branches -> merge-base with origin/dev).
          CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
      - name: Check Go formatting and static analysis
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
