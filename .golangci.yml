run:
  timeout: 5m
  tests: true
  build-tags: []

linters:
  enable:
    - gofmt
    - goimports
    - govet
    - errcheck
    - staticcheck
    - gosimple
    - ineffassign
    - unused
    - typecheck
    - bodyclose
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - misspell
    - unconvert
    - unparam
    - gocritic
    - revive

linters-settings:
  goimports:
    local-prefixes: github.com/clawhunt-cloxier/vera-main
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
    disabled-checks:
      - commentFormatting
  revive:
    rules:
      - name: exported
        disabled: true
      - name: package-comments
        disabled: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
    - path: migrations/
      linters:
        - all
  max-issues-per-linter: 0
  max-same-issues: 0
